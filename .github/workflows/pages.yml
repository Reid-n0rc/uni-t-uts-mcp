name: Pages

# Builds the project site (site/index.html + a tool list generated from the server's own tool
# definitions and docs/tools-reference.md) and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/tools-reference.md"
      - "scripts/site-tools.mjs"
      - "scripts/build-site.mjs"
      - "src/tools/**"
      - "src/server.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
