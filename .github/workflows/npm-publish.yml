name: Publish to npm

# The project is released as a GitHub release (with the packed tarball) plus a
# GHCR Docker image (release.yml, docker-publish.yml) and on npm (this workflow). It skips cleanly
# (green run, notice) while the repository secret NPM_TOKEN is not set.
#
# Runs only for version tags (v*). The tag must equal v<package.json version>; see docs/releasing.md.
# Once a token exists it publishes with provenance. Authentication, either of:
#   - repository secret NPM_TOKEN (granular publish token): needed for the very first publish of
#     a package that does not exist on npm yet, because trusted publishing can only be configured
#     on an existing package;
#   - npm trusted publishing (OIDC, no secret) once the package exists and this workflow is
#     registered as a trusted publisher on npmjs.com. Then this workflow must be changed to drop the
#     skip condition (see docs/releasing.md, "npm publishing").

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation and trusted publishing
    env:
      # Empty when the secret is not configured; used only to choose the publish step below.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Skip when no npm token is configured
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::notice::NPM_TOKEN is not set, so nothing is published to npm for $GITHUB_REF_NAME (GitHub release and Docker image are handled by other workflows). See docs/releasing.md, 'npm publishing'."

      - name: Checkout
        if: env.HAS_NPM_TOKEN == 'true'
        uses: actions/checkout@v7

      - name: Check the tag matches package.json
        if: env.HAS_NPM_TOKEN == 'true'
        run: node scripts/release-tools.mjs check-tag "$GITHUB_REF_NAME"

      - name: Set up Node.js
        if: env.HAS_NPM_TOKEN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        if: env.HAS_NPM_TOKEN == 'true'
        # Trusted publishing needs npm 11.5.1 or newer.
        run: npm install -g npm@11

      - name: Install dependencies
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm ci

      - name: Build
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm run build

      - name: Check the tarball contents
        if: env.HAS_NPM_TOKEN == 'true'
        run: node scripts/check-pack.mjs

      - name: Publish
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
